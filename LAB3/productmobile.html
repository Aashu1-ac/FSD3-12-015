<!DOCTYPE html>
<html>
<head>
    <title>Mobile Phone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        .container {
            width: 80%;
            margin: 50px auto;
            background: white;
            padding: 30px;
            display: flex;
            gap: 50px;
            border-radius: 15px;
        }

        .phone-image {
            width: 40%;
            text-align: center;
        }

        .phone-image img {
            width: 300px;
        }

        .details {
            width: 50%;
        }

        h1 {
            font-size: 40px;
        }

        .rating {
            color: green;
            font-weight: bold;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
        }

        .buy {
            background: black;
            color: white;
            padding: 15px 35px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .specs {
            margin-top: 25px;
        }

        li {
            margin: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="phone-image">
            <img src="phone.jpg" alt="Mobile Phone">
        </div>

        <div class="details">
            <h1>Nova X1</h1>

            <p>Powerful. Elegant. Made for you.</p>

            <p class="rating">★ 4.7/5</p>

            <p class="price">₹39,999</p>

            <button class="buy">Buy Now</button>

            <div class="specs">
                <h2>Specifications</h2>

                <ul>
                    <li>6.7-inch AMOLED Display</li>
                    <li>8GB RAM</li>
                    <li>256GB Storage</li>
                    <li>5000mAh Battery</li>
                    <li>50MP Camera</li>
                    <li>5G Connectivity</li>
                </ul>
            </div>
        </div>

    </div>

</body>
</html>
